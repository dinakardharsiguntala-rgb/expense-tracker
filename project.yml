name: ExpenseTracker
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"

targets:
  ExpenseTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ExpenseTrackerApp.swift
      - path: Models
      - path: Services
      - path: ViewModels
      - path: Views
      - path: Intents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.ExpenseTracker
        PRODUCT_NAME: ExpenseTracker
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Expenses"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        DEVELOPMENT_TEAM: ""

  MessageFilterExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Extensions/MessageFilterExtension/MessageFilterExtension.swift
      - path: Services/BankSMSParser.swift
      - path: Services/BankPatternRegistry.swift
      - path: Services/SharedExpenseDatabase.swift
      - path: Models/Enums.swift
    info:
      path: Extensions/MessageFilterExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.ExpenseTracker.MessageFilterExtension
        PRODUCT_NAME: MessageFilterExtension
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        DEVELOPMENT_TEAM: ""
