name: Build Mobile App (Android APK & iOS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Configure Android platform scaffolding
        run: |
          flutter create . --platforms=android --org com.expensetracker --project-name expense_tracker --overwrite 2>&1 | tee create.log || {
            echo "### Flutter Create Failed" >> $GITHUB_STEP_SUMMARY
            cat create.log >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release 2>&1 | tee build_apk.log || {
            echo "### Flutter APK Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build_apk.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }



      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error


