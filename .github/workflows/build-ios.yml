name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build iOS Application
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          echo "Selected Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App for iOS Device (Ad-Hoc / Sideloadly)
        run: |
          set -o pipefail
          xcodebuild \
            -project ExpenseTracker.xcodeproj \
            -scheme ExpenseTracker \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build 2>&1 | tee xcodebuild.log || {
              echo "==================== BUILD FAILED - RECENT LOGS ===================="
              tail -n 120 xcodebuild.log
              echo "==================== ERRORS EXTRACTED ===================="
              grep -E "(error:|fatal error:|BUILD FAILED)" xcodebuild.log || true
              exit 1
            }

      - name: Report Build Logs in Step Summary
        if: always()
        run: |
          if [ -f xcodebuild.log ]; then
            echo "### Xcodebuild Tail Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 xcodebuild.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### Extracted Errors" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "(error:|fatal error:|BUILD FAILED)" xcodebuild.log | head -n 40 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Push Build Log to Git Branch on Failure
        if: failure()
        run: |
          if [ -f xcodebuild.log ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B ios-log
            git add xcodebuild.log
            git commit -m "Save xcodebuild log" || true
            git push origin ios-log --force || true
          fi



      - name: Package .IPA for iPhone Sideloading
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find ./DerivedData/Build/Products/Release-iphoneos -name "ExpenseTracker.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ./DerivedData -name "ExpenseTracker.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r ExpenseTracker.ipa Payload
          zip -r ExpenseTracker-App.zip Payload/ExpenseTracker.app
          cd ..

      - name: Upload iOS .IPA (for Sideloadly & AltStore)
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-iOS-IPA
          path: build/ExpenseTracker.ipa
          if-no-files-found: error

