name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Application
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          echo "Selected Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App for iOS Device (Ad-Hoc / Sideloadly)
        run: |
          xcodebuild \
            -project ExpenseTracker.xcodeproj \
            -scheme ExpenseTracker \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build

      - name: Package .IPA for iPhone Sideloading
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find ./DerivedData/Build/Products/Release-iphoneos -name "ExpenseTracker.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ./DerivedData -name "ExpenseTracker.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r ExpenseTracker.ipa Payload
          zip -r ExpenseTracker-App.zip Payload/ExpenseTracker.app
          cd ..

      - name: Upload iOS .IPA (for Sideloadly & AltStore)
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-iOS-IPA
          path: build/ExpenseTracker.ipa
          if-no-files-found: error

